name: Android APK

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

# Two jobs, so that a pull request never runs in a job that can read the release signing key.
# - build-check (pull requests only): checks that the Android app still builds. It has no secrets and uploads nothing.
# - build-release (pushes to master and manual runs only): the release build, signed with the key from the
#   repository's secrets, and the APK teachers install.
# Actions are pinned to full commit SHAs (the version tag is in the comment) so a moved tag can't change what runs.

jobs:
  build-check:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      # Checks the committed gradle-wrapper.jar against Gradle's published checksums before it runs.
      - uses: gradle/actions/wrapper-validation@8da46b539cd8fe6ab27ca75128919a18d757604c # v6

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6
        with:
          distribution: temurin
          java-version: 21
          cache: gradle

      - name: Install dependencies
        run: npm ci

      - name: Build web app and copy it into the Android project
        run: npm run android:sync

      # A debug build, signed with this runner's throwaway key, only to check that the app compiles. It is never
      # uploaded or handed out.
      - name: Build APK (check only)
        working-directory: android
        run: ./gradlew assembleDebug

  build-release:
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref == 'refs/heads/master')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      # Checks the committed gradle-wrapper.jar against Gradle's published checksums before it runs.
      - uses: gradle/actions/wrapper-validation@8da46b539cd8fe6ab27ca75128919a18d757604c # v6

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6
        with:
          distribution: temurin
          java-version: 21
          cache: gradle

      - name: Install dependencies
        run: npm ci

      - name: Build web app and copy it into the Android project
        run: npm run android:sync

      # The APK teachers install is a release build, signed with the private release key from the repository's
      # secrets (not debuggable, so student data can't be copied off a phone over USB). Without those secrets the
      # app is still built, as a check that it compiles, but nothing is published: a debug build is signed with
      # this runner's throwaway key and is never handed out.
      - name: Build APK
        id: apk
        working-directory: android
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.keystore"
            export ANDROID_KEYSTORE_FILE="$RUNNER_TEMP/release.keystore"
            ./gradlew assembleRelease
            cp app/build/outputs/apk/release/app-release.apk "$RUNNER_TEMP/AscendEd.apk"
            rm -f "$RUNNER_TEMP/release.keystore"
            echo "release=true" >> "$GITHUB_OUTPUT"
          else
            ./gradlew assembleDebug
            echo "release=false" >> "$GITHUB_OUTPUT"
            echo "::notice title=No APK published::The release signing key isn't set in this repository's secrets, so the app was built as a check only. Add ANDROID_KEYSTORE_BASE64, ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_ALIAS and ANDROID_KEY_PASSWORD to publish an installable APK."
          fi

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: steps.apk.outputs.release == 'true'
        with:
          name: AscendEd-apk
          path: ${{ runner.temp }}/AscendEd.apk
          if-no-files-found: error
