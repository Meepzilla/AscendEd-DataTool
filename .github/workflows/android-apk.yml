name: Android APK

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21
          cache: gradle

      - name: Install dependencies
        run: npm ci

      - name: Build web app and copy it into the Android project
        run: npm run android:sync

      # With the release key in the repository's secrets, the APK is a release build (not debuggable, so student
      # data can't be copied off a phone over USB). Without them, a debug build as before.
      - name: Build APK
        working-directory: android
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.keystore"
            export ANDROID_KEYSTORE_FILE="$RUNNER_TEMP/release.keystore"
            ./gradlew assembleRelease
            cp app/build/outputs/apk/release/app-release.apk "$RUNNER_TEMP/AscendEd.apk"
          else
            ./gradlew assembleDebug
            cp app/build/outputs/apk/debug/app-debug.apk "$RUNNER_TEMP/AscendEd.apk"
          fi

      - uses: actions/upload-artifact@v7
        with:
          name: AscendEd-apk
          path: ${{ runner.temp }}/AscendEd.apk
          if-no-files-found: error
