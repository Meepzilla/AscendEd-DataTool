# Dependabot: keeps the app's libraries up to date.
#
# - Security fixes: when GitHub finds a vulnerability in a library the app uses, Dependabot opens a pull
#   request with the fixed version right away (needs "Dependabot alerts" and "Dependabot security updates"
#   turned on in the repository's Settings → Code security).
# - Routine updates: once a month, grouped so they arrive as a few pull requests instead of dozens. Minor
#   and patch versions come together; a major version (which can need code changes, e.g. Next.js or React)
#   gets its own pull request.
#
# Every update is a pull request: CI (the Android build) and the preview builds run on it, and nothing changes
# in the app until it is merged.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 5
    groups:
      minor-and-patch:
        update-types: [minor, patch]
    labels: [dependencies]
    commit-message:
      prefix: deps

  # The GitHub Actions used by the Android build workflow.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    groups:
      actions:
        patterns: ["*"]
    labels: [dependencies]
    commit-message:
      prefix: ci
